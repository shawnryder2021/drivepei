name: Sync used inventory
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Import latest vehicles
        env:
          SITE_URL: ${{ secrets.DRIVEPEI_SITE_URL }}
          SYNC_TOKEN: ${{ secrets.DRIVEPEI_SYNC_TOKEN }}
        run: |
          test -n "$SITE_URL" && test -n "$SYNC_TOKEN"
          curl --fail --show-error --silent --max-time 60 \
            -X POST "$SITE_URL/api/admin/sync" \
            -H "Authorization: Bearer $SYNC_TOKEN"
